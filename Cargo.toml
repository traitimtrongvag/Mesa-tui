[package]
name = "ClientMessage"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10.3"
rsa = "0.9.6"
base64 = "0.22.1"
rand = "0.8"
