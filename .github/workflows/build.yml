name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ClientMessage-windows-x64
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: ClientMessage-windows-arm64
            ext: .exe
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ClientMessage-linux-arm64
            ext: ""
            cargo_features: "--features openssl/vendored"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_features }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/*${{ matrix.ext }}
          if-no-files-found: error
